<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ec">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161a1b">
  <meta name="description" content="New papers from the top economics journals, summarised, tagged and mapped: methods, fields, data and who works on what.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lit Radar">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css?v=15">
  <title>EconRadar</title>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#latest"><img src="icon-192.png" alt=""><span>EconRadar<small>READ · MAP · FOLLOW</small></span></a>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="side-note">
        <p id="side-status">Loading the radar…</p>
        <p class="side-small">Updated every Tuesday from 20 leading journals and NBER, since 2020. Saved papers, notes and followed authors stay on this device.</p>
        <a href="../">← All your apps</a>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span id="crumb">LATEST</span>
        <div class="top-right"><span id="top-count"></span><button id="filter-toggle" class="btn ghost small" type="button" aria-expanded="false" aria-controls="filter-bar">Filters <b id="filter-count" hidden></b></button></div>
      </header>
      <section id="filter-bar" class="filter-bar" aria-label="Filters"></section>
      <main id="main" tabindex="-1"><p class="loading">Loading papers…</p></main>
      <footer><span>Read widely. Map what moves.</span><span id="footer-status"></span></footer>
    </div>
  </div>
  <dialog id="dialog"><form method="dialog" class="dialog-close"><button class="icon-button" aria-label="Close">×</button></form><div id="dialog-content"></div></dialog>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="vendor/d3.min.js"></script>
  <script type="module" src="app.mjs?v=18"></script>

<link rel="stylesheet" href="../shared/motion.css?v=1">
<script type="module" src="../shared/motion.mjs?v=1"></script>
</body>
</html>
